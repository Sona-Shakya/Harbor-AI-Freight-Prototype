<!doctype html><html><head><title>Harbor layout verification</title><style>html,body{margin:0;background:#eef2f8;overflow:hidden}iframe{border:0;position:absolute;transform-origin:top left;background:white}</style></head><body><iframe id="preview" title="Harbor preview"></iframe><script>const p=new URLSearchParams(location.search);const w=Number(p.get('width'))||1487,h=Number(p.get('height'))||1058;const el=document.querySelector('iframe');el.width=w;el.height=h;el.src='/';function fit(){const s=Math.min(1,innerWidth/w,innerHeight/h);el.style.transform='scale('+s+')'}fit();addEventListener('resize',fit);</script></body></html>
